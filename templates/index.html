<!DOCTYPE html>
<html>

<head>

    <title>HustleHubM Lead Machine</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>HustleHubM</h1>

    <p class="subtitle">
        AI Lead Machine
    </p>

    <div class="card">

        <h2>Add Lead</h2>

        <form action="/add-lead" method="POST">

            <input
                name="business_name"
                placeholder="Business name"
                required
            >

            <input
                name="website"
                placeholder="Website"
            >

            <input
                name="email"
                placeholder="Business email"
                type="email"
            >

            <input
                name="industry"
                placeholder="Industry"
            >

            <input
                name="location"
                placeholder="Location"
            >

            <label>
                <input type="checkbox" name="website_outdated">
                Website needs improvement
            </label>

            <label>
                <input type="checkbox" name="has_booking">
                Has online booking
            </label>

            <label>
                <input type="checkbox" name="weak_cta">
                Weak call-to-action
            </label>

            <label>
                <input type="checkbox" name="weak_social">
                Weak social presence
            </label>

            <button type="submit">
                Add & Score Lead
            </button>

        </form>

    </div>


    <div class="card">

        <h2>Qualified Leads</h2>

        <table>

            <tr>
                <th>Business</th>
                <th>Industry</th>
                <th>Location</th>
                <th>Score</th>
                <th>Opportunity</th>
                <th>Email</th>
            </tr>

            {% for lead in leads %}

            <tr>

                <td>{{ lead["business_name"] }}</td>

                <td>{{ lead["industry"] }}</td>

                <td>{{ lead["location"] }}</td>

                <td>
                    <strong>{{ lead["lead_score"] }}/100</strong>
                </td>

                <td>{{ lead["opportunity"] }}</td>

                <td>{{ lead["email"] }}</td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>

</html>
